name: Docs Structure Drift

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'docs/architecture/OVERVIEW.md'
      - 'apps/**'
      - 'contracts/**'
      - 'packages/**'
      - 'services/**'
      - 'scripts/**'
      - 'tools/**'
      - 'types/**'
      - '__tests__/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-structure-drift.yml'
      - '*/**'
  push:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'docs/architecture/OVERVIEW.md'
      - 'apps/**'
      - 'contracts/**'
      - 'packages/**'
      - 'services/**'
      - 'scripts/**'
      - 'tools/**'
      - 'types/**'
      - '__tests__/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-structure-drift.yml'
      - '*/**'

permissions:
  contents: read

jobs:
  docs-structure-drift:
    name: Check docs structure drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check documented repository structure
        run: pnpm docs:check-structure
